[package]
name = "netherite-desktop"
version = "1.0.0"
description = "Netherite Sovereign Studio"
authors = ["Parv Shah"]
edition = "2021"

[lib]
name = "netherite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
